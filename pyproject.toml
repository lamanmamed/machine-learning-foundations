[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-foundations"
version = "0.1.0"
description = "Machine learning fundamentals implemented across regression, classification, neural networks, and Gaussian mixture models"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
